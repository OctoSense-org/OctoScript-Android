[package]
name = "octoscript_catalog"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "octoscript_catalog"
crate-type = ["cdylib", "rlib"]

[dependencies]
octoscript-render = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "62760863bc992aeb7b43692b10d479417b4d3d93" }
jni = "0.21"
serde_json = "1.0.151"
ureq = { version = "2", features = ["tls"] }

[profile.release]
opt-level = 2

# Resolve the exact framework sources prepared by tools/setup-native.py.

[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-script = { path = "../../../makepad/platform/script" }

[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-render = { path = "../../../octoscript-makepad/crates/octoscript-render" }
