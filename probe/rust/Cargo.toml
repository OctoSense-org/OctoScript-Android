[package]
name = "octoscript_android_probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "octoscript_android_probe"
crate-type = ["cdylib"]

# The real thing: the backend-agnostic Octoscript renderer core. Depends only on
# makepad-script (the VM). No makepad-platform / draw / widgets anywhere.
[dependencies]
octoscript-render = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "6cf2d90aa33ff4ae603f49c7557f3ecf986207f0" }
jni = "0.21"

[profile.release]
opt-level = 2

# Resolve the exact framework sources prepared by tools/setup-native.py.

[patch."https://github.com/OctoSense-org/makepad.git"]
makepad-script = { path = "../../../makepad/platform/script" }

[patch."https://github.com/OctoSense-org/Octoscript-Makepad.git"]
octoscript-render = { path = "../../../octoscript-makepad/crates/octoscript-render" }
